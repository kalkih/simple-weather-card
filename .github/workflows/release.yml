name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Set version
        run: |
          TAG="${{ github.ref_name }}"
          PKG_VERSION="${TAG#v}"
          echo "export const version = '${TAG}';" > src/var/version.ts
          jq --arg v "$PKG_VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json

      - name: Build
        run: yarn build

      - name: Smoke test
        run: yarn test

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/simple-weather-card.js
          generate_release_notes: true
          # Tags with a suffix, like v2.10.0-beta-1, are prereleases
          prerelease: ${{ contains(github.ref_name, '-') }}
